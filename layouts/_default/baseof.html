<!doctype html>
<html lang="{{ .Site.LanguageCode | default "zh-cn" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if .Title }}{{ .Title }} | {{ end }}{{ .Site.Title }}</title>
  </head>
  <body>
    <header style="padding: 16px 24px; border-bottom: 1px solid #eee;">
      <nav style="display:flex; gap:16px; flex-wrap:wrap;">
        {{ range .Site.Menus.main }}
          <a href="{{ .URL }}" style="text-decoration:none; color:#111; font-weight:600;">{{ .Name }}</a>
        {{ end }}
      </nav>
    </header>

    <main style="max-width: 980px; margin: 0 auto; padding: 24px;">
      {{ block "main" . }}{{ end }}
    </main>

    <footer style="padding: 24px; border-top: 1px solid #eee; color:#666;">
      {{ now.Year }} · {{ .Site.Title }}
    </footer>
  </body>
</html>
